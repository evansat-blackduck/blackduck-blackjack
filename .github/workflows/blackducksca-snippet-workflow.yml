name: Black Duck Snippet Scan

# Request repository-level permissions for the workflow. Organization or repository
# settings can still restrict these; see repository Actions settings if you still
# get authorization errors.
permissions:
  contents: read
  pull-requests: write
  issues: write

env:
  GITHUB_TOKEN: ${{ secrets.GH_PAT }}

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]

jobs:
  snippet-scan:
    name: Scan PR with Black Duck Snippet API
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
      issues: write

    steps:
      - name: Checkout repository (PR head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Explicitly check out the PR head so we scan the proposed changes
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Generate PR diff
        run: |
          echo "Generating diff between base and head..."
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"
          # Ensure refs are available and create a binary diff of the PR
          git fetch --no-tags --prune --depth=1 origin "+refs/heads/*:refs/remotes/origin/*" || true
          git diff --binary "$BASE_SHA" "$HEAD_SHA" > pr.diff || true
          ls -l pr.diff || true

      - name: Get AI License Compliance API auth token
        # Obtain an auth token from the Black Duck Authenticate endpoint using the
        # repository secret `BLACKDUCKSCA_TOKEN`. The response will be saved to
        # `token.json` and the extracted token to `auth_token.txt` for subsequent calls.
        env:
          BLACKDUCKSCA_URL: ${{ vars.BLACKDUCKSCA_URL }}
          BLACKDUCKSCA_TOKEN: ${{ secrets.BLACKDUCKSCA_TOKEN }}
        run: |
          if [ -z "$BLACKDUCKSCA_URL" ] || [ -z "$BLACKDUCKSCA_TOKEN" ]; then
            echo "Missing BLACKDUCKSCA_URL (repository variable) or BLACKDUCKSCA_TOKEN (secret)"
            echo "Add `BLACKDUCKSCA_URL` under Settings → Variables and `BLACKDUCKSCA_TOKEN` under Settings → Secrets."
            exit 1
          fi
          AUTH_ENDPOINT="${BLACKDUCKSCA_URL%/}/api/tokens/authenticate"
          echo "Requesting auth token from $AUTH_ENDPOINT"

          # Request token and save raw response
          curl -s -X POST "$AUTH_ENDPOINT" \
            -H "Content-Type: application/json" \
            -H "Authorization: token $BLACKDUCKSCA_TOKEN" \
            -d '{}' -o token.json || true

          echo "--- raw token response ---"
          cat token.json || true

          # Try to extract a token from common JSON fields using jq (install if needed)
          if ! command -v jq >/dev/null 2>&1; then
            sudo apt-get update -y && sudo apt-get install -y jq || true
          fi

          AUTH_TOKEN=""
          if command -v jq >/dev/null 2>&1; then
            AUTH_TOKEN=$(jq -r '.bearerToken // .token // .auth_token // .access_token // .tokenValue // .value // .data // empty' token.json 2>/dev/null || true)
          fi

          # Fallback to raw content if jq extraction failed
          if [ -z "$AUTH_TOKEN" ] || [ "$AUTH_TOKEN" = "null" ]; then
            AUTH_TOKEN=$(tr -d '\r\n "' < token.json)
          fi

          if [ -z "$AUTH_TOKEN" ]; then
            echo "Failed to obtain auth token from $AUTH_ENDPOINT"
            exit 1
          fi

          echo "Auth token extracted (truncated): ${AUTH_TOKEN:0:8}..."
          echo "$AUTH_TOKEN" > auth_token.txt

      - name: Send diff to Black Duck Snippet API
        env:
          BLACKDUCKSCA_URL: ${{ vars.BLACKDUCKSCA_URL }}
        run: |
          if [ ! -f auth_token.txt ]; then
            echo "Missing auth token file (auth_token.txt)"
            exit 1
          fi
          AUTH_TOKEN=$(cat auth_token.txt)
          API_ENDPOINT="${BLACKDUCKSCA_URL%/}/api/snippet-matching"
          echo "Posting pr.diff to $API_ENDPOINT"

          # The snippet-matching endpoint expects a plain text payload containing
          # the source to scan. Send the diff file as `text/plain` in the request
          # body using --data-binary to preserve content.
          HTTP_STATUS=$(curl -s -o response.json -w "%{http_code}" -X POST \
            -H "Authorization: Bearer $AUTH_TOKEN" \
            -H "Content-Type: text/plain" \
            --data-binary @pr.diff \
            "$API_ENDPOINT")

          echo "HTTP status: $HTTP_STATUS"
          cat response.json || true
          if [ "$HTTP_STATUS" -ge 400 ]; then
            echo "Black Duck Snippet API returned an error (status $HTTP_STATUS)."
            exit 1
          fi

      - name: Comment PR with Black Duck results
        uses: actions/github-script@v6
        with:
          # Explicitly pass the workflow token to the action
          github-token: ${{ secrets.GH_PAT }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            let body = '### Black Duck Snippet Scan Results\n\n';
            
            if (fs.existsSync('response.json')) {
              try {
                const respText = fs.readFileSync('response.json', 'utf8');
                const response = JSON.parse(respText);
                
                // Check if snippetMatches exists and process the nested structure
                if (response.snippetMatches && typeof response.snippetMatches === 'object') {
                  const matchCategories = Object.keys(response.snippetMatches);
                  let totalMatches = 0;
                  
                  // Count total matches across all categories
                  matchCategories.forEach(category => {
                    if (Array.isArray(response.snippetMatches[category])) {
                      totalMatches += response.snippetMatches[category].length;
                    }
                  });
                  
                  if (totalMatches > 0) {
                    body += `🔍 **Found ${totalMatches} snippet match(es) across ${matchCategories.length} license categor${matchCategories.length === 1 ? 'y' : 'ies'}:**\n\n`;
                    
                    let matchIndex = 1;
                    
                    // Process each license category
                    matchCategories.forEach(category => {
                      if (response.snippetMatches[category] && response.snippetMatches[category].length > 0) {
                        body += `### ${category.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, l => l.toUpperCase())} (${response.snippetMatches[category].length} match${response.snippetMatches[category].length === 1 ? '' : 'es'})\n\n`;
                        
                        response.snippetMatches[category].forEach((match) => {
                          body += `#### Match ${matchIndex++}\n`;
                          
                          if (match.projectName) {
                            body += `- **Project**: ${match.projectName}\n`;
                          }
                          if (match.releaseVersion) {
                            body += `- **Version**: ${match.releaseVersion}\n`;
                          }
                          if (match.matchedFilePath) {
                            body += `- **Matched File Path**: \`${match.matchedFilePath}\`\n`;
                          }
                          if (match.licenseDefinition && match.licenseDefinition.licenseDisplayName) {
                            body += `- **License**: ${match.licenseDefinition.licenseDisplayName}\n`;
                          }
                          if (match.regions) {
                            const regions = match.regions;
                            if (regions.sourceStartLines && regions.sourceEndLines) {
                              body += `- **Source Lines**: ${regions.sourceStartLines.join(', ')}-${regions.sourceEndLines.join(', ')}\n`;
                            }
                            if (regions.matchedStartLines && regions.matchedEndLines) {
                              body += `- **Matched Lines**: ${regions.matchedStartLines.join(', ')}-${regions.matchedEndLines.join(', ')}\n`;
                            }
                          }
                          
                          body += '\n';
                        });
                        
                        body += '\n';
                      }
                    });
                  } else {
                    body += '✅ **No snippet matches found** - No known open source code detected in the pull request changes.\n\n';
                  }
                } else {
                  body += '✅ **No snippet matches found** - No known open source code detected in the pull request changes.\n\n';
                }
                
                // Add raw response as collapsible section for debugging
                const maxLen = 32000;  // Reduced size to leave room for formatted content
                let rawDisplay = respText;
                if (rawDisplay.length > maxLen) {
                  rawDisplay = rawDisplay.slice(0, maxLen) + '\n... (truncated)';
                }
                body += '<details><summary>🔧 Raw API Response (for debugging)</summary>\n\n```json\n' + rawDisplay + '\n```\n</details>';
                
              } catch (parseError) {
                body += '⚠️ **Error parsing Black Duck response**: Could not parse JSON response.\n\n';
                console.error('JSON parse error:', parseError);
                
                // Fall back to raw content display
                const respText = fs.readFileSync('response.json', 'utf8');
                const maxLen = 32000;
                let display = respText;
                if (display.length > maxLen) {
                  display = display.slice(0, maxLen) + '\n... (truncated)';
                }
                body += '<details><summary>Raw response content</summary>\n\n```\n' + display + '\n```\n</details>';
              }
            } else {
              body += '❌ **No response captured from Black Duck** - The API request may have failed.\n\n';
            }
            
            await github.rest.issues.createComment({ owner, repo, issue_number, body });
