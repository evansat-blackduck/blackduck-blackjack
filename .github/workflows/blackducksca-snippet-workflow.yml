name: Black Duck Snippet Scan

# =============================================================================
# REUSABLE BLACK DUCK SNIPPET SCANNING WORKFLOW
# =============================================================================
#
# This workflow can be used in multiple ways across different repositories:
#
# 1. DIRECT USAGE (copy this file to .github/workflows/):
#    Simply copy this file to your repository's .github/workflows/ directory
#    and configure the required secrets and variables.
#
# 2. WORKFLOW_CALL (reusable workflow):
#    Call this workflow from another workflow using workflow_call trigger.
#    Example:
#      jobs:
#        blackduck-scan:
#          uses: your-org/your-repo/.github/workflows/blackducksca-snippet-workflow.yml@main
#          with:
#            min_file_chars: 500
#            custom_comment_header: "Custom Security Scan Results"
#            file_patterns: '\.(java|py|js)$'
#
# 3. CONFIGURATION OPTIONS:
#    A. Via workflow inputs (when using workflow_call):
#       - min_file_chars: Minimum characters per file (default: 300)
#       - max_total_chars: Maximum total characters to scan (default: 50000)
#       - file_patterns: Custom regex for file selection (optional)
#       - python_version: Python version to use (default: 3.11)
#       - api_timeout: API timeout in seconds (default: 120)
#       - custom_comment_header: PR comment header text
#       - skip_small_files: Whether to skip small files (default: true)
#
#    B. Via repository variables (Settings → Environments → Variables):
#       - BD_MIN_FILE_CHARS: Override minimum file characters
#       - BD_MAX_TOTAL_CHARS: Override maximum total characters
#       - BD_PYTHON_VERSION: Override Python version
#       - BD_API_TIMEOUT: Override API timeout
#       - BD_COMMENT_HEADER: Override PR comment header
#       - BD_SKIP_SMALL_FILES: Override small file skipping (true/false)
#
# 4. REQUIRED SETUP:
#    - Repository Variable: BLACKDUCKSCA_URL (your Black Duck server URL)
#    - Repository Secret: BLACKDUCKSCA_TOKEN (your Black Duck API token)
#
# 5. EXAMPLE CONFIGURATIONS:
#
#    Python Project:
#      file_patterns: '\.(py|pyx|pxd|requirements\.txt|setup\.py|pyproject\.toml)$'
#      min_file_chars: 200
#
#    JavaScript/Node.js Project:
#      file_patterns: '\.(js|jsx|ts|tsx|json|package\.json|yarn\.lock)$'
#      min_file_chars: 300
#
#    Java/Maven Project:
#      file_patterns: '\.(java|xml|properties|gradle)$|^(pom\.xml|build\.gradle)$'
#      min_file_chars: 400
#
#    Multi-language Project (default):
#      Leave file_patterns empty for auto-detection of all supported languages
#
# =============================================================================

# Request repository-level permissions for the workflow
permissions:
  contents: read
  pull-requests: write
  issues: write

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  workflow_call:
    inputs:
      min_file_chars:
        description: 'Minimum characters required per file to include in scan'
        type: number
        default: 300
      max_total_chars:
        description: 'Maximum total characters to send to Black Duck API'
        type: number
        default: 50000
      file_patterns:
        description: 'Custom file patterns to scan (regex). Leave empty for auto-detection.'
        type: string
        required: false
      python_version:
        description: 'Python version to use for the workflow'
        type: string
        default: '3.11'
      api_timeout:
        description: 'API request timeout in seconds'
        type: number
        default: 120
      custom_comment_header:
        description: 'Custom header text for PR comments'
        type: string
        default: 'Black Duck Snippet Scan Results'
      skip_small_files:
        description: 'Whether to skip files smaller than min_file_chars'
        type: boolean
        default: true

env:
  # Configurable via repository variables with fallbacks
  MIN_FILE_CHARS: ${{ inputs.min_file_chars || vars.BD_MIN_FILE_CHARS || '300' }}
  MAX_TOTAL_CHARS: ${{ inputs.max_total_chars || vars.BD_MAX_TOTAL_CHARS || '50000' }}
  PYTHON_VERSION: ${{ inputs.python_version || vars.BD_PYTHON_VERSION || '3.11' }}
  API_TIMEOUT: ${{ inputs.api_timeout || vars.BD_API_TIMEOUT || '120' }}
  COMMENT_HEADER: ${{ inputs.custom_comment_header || vars.BD_COMMENT_HEADER || 'Black Duck Snippet Scan Results' }}
  SKIP_SMALL_FILES: ${{ inputs.skip_small_files != false && (vars.BD_SKIP_SMALL_FILES != 'false') }}

jobs:
  snippet-scan:
    name: Scan PR with Black Duck Snippet API
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository (PR head)
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          # Explicitly check out the PR head so we scan the proposed changes
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Cache Python dependencies
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Extract PR file contents (${{ env.MIN_FILE_CHARS }}-${{ env.MAX_TOTAL_CHARS }} char limit)
        run: |
          echo "Extracting file contents from PR (min $MIN_FILE_CHARS, max $MAX_TOTAL_CHARS total chars)..."
          BASE_SHA="${{ github.event.pull_request.base.sha }}"
          HEAD_SHA="${{ github.event.pull_request.head.sha }}"
          echo "Base: $BASE_SHA"
          echo "Head: $HEAD_SHA"
          
          # Ensure refs are available
          git fetch --no-tags --prune --depth=1 origin "+refs/heads/*:refs/remotes/origin/*" || true
          
          # Get list of changed source code files only (added, modified, copied, renamed)
          # Use custom file patterns if provided, otherwise use default patterns
          if [ -n "${{ inputs.file_patterns }}" ]; then
            echo "Using custom file patterns: ${{ inputs.file_patterns }}"
            CHANGED_FILES=$(git diff --name-only --diff-filter=AMCR "$BASE_SHA" "$HEAD_SHA" | \
              grep -E '${{ inputs.file_patterns }}' || true)
          else
            echo "Using default file patterns for source code detection"
            # Filter for common source code file extensions and build files
            CHANGED_FILES=$(git diff --name-only --diff-filter=AMCR "$BASE_SHA" "$HEAD_SHA" | \
              grep -E '\.(java|js|jsx|ts|tsx|py|cpp|c|h|hpp|cs|go|rs|php|rb|swift|kt|scala|clj|pl|sh|bat|ps1|sql|yaml|yml|json|xml|html|css|scss|less|vue|svelte|toml|lock|gradle|properties|txt|md|dockerfile|makefile|cmake)$|^(Dockerfile|Makefile|CMakeLists\.txt|requirements\.txt|Pipfile|Gemfile|Cargo\.(toml|lock)|go\.(mod|sum)|build\.gradle|gradle\.properties|composer\.(json|lock)|package(-lock)?\.json|yarn\.lock|poetry\.lock)$' || true)
          fi
          
          echo "Changed source code files:"
          echo "$CHANGED_FILES"
          
          # Create a combined file with snippets from each changed file
          > file_snippets.txt
          
          # Initialize counters and limits from environment variables
          MAX_TOTAL_CHARS=${{ env.MAX_TOTAL_CHARS }}
          MIN_FILE_CHARS=${{ env.MIN_FILE_CHARS }}
          current_size=0
          file_count=0
          skipped_files=0
          
          # Add header (reserve chars for metadata)
          {
            echo "=== PR File Snippets Analysis ==="
            echo "Pull Request: ${{ github.event.pull_request.number }}"
            echo "Repository: ${{ github.repository }}"
            echo ""
          } >> file_snippets.txt
          current_size=$(wc -c < file_snippets.txt)
          
          while IFS= read -r file; do
            if [ -n "$file" ] && [ -f "$file" ]; then
              # Check if file is readable and get its size
              file_size=$(wc -c < "$file" 2>/dev/null || echo 0)
              
              # Skip files smaller than minimum if enabled
              if [ "${{ env.SKIP_SMALL_FILES }}" = "true" ] && [ "$file_size" -lt "$MIN_FILE_CHARS" ]; then
                echo "Skipping $file (only $file_size chars, need min $MIN_FILE_CHARS)"
                skipped_files=$((skipped_files + 1))
                continue
              fi
              
              # Calculate how many characters we can take from this file
              remaining_space=$((MAX_TOTAL_CHARS - current_size))
              
              # Reserve space for file delimiter (approximately 100 chars)
              file_delimiter_size=100
              available_for_content=$((remaining_space - file_delimiter_size))
              
              if [ "$available_for_content" -lt "$MIN_FILE_CHARS" ]; then
                echo "Stopping at $file - not enough space remaining (need $MIN_FILE_CHARS, have $available_for_content)"
                break
              fi
              
              file_count=$((file_count + 1))
              echo "Processing file $file_count: $file (size: $file_size chars)"
              
              # Determine how much content to extract
              if [ "$file_size" -le "$available_for_content" ]; then
                # Take the whole file if it fits
                chars_to_take=$file_size
              else
                # Take as much as we can fit
                chars_to_take=$available_for_content
              fi
              
              # Add file header and content
              {
                echo "=== FILE $file_count: $file ($chars_to_take chars) ==="
                head -c "$chars_to_take" "$file" 2>/dev/null || echo "[Binary or unreadable file]"
                echo ""
                echo "--- END OF $file ---"
                echo ""
              } >> file_snippets.txt
              
              # Update current size
              current_size=$(wc -c < file_snippets.txt)
              echo "Current total size: $current_size chars"
              
              # Safety check
              if [ "$current_size" -ge "$MAX_TOTAL_CHARS" ]; then
                echo "Reached maximum size limit ($MAX_TOTAL_CHARS chars)"
                break
              fi
            fi
          done <<< "$CHANGED_FILES"
          
          final_size=$(wc -c < file_snippets.txt)
          echo "Final summary:"
          echo "- Processed $file_count files"
          echo "- Skipped $skipped_files files (too small)"
          echo "- Final size: $final_size characters"
          echo "- Within limits: min $MIN_FILE_CHARS, max $MAX_TOTAL_CHARS"
          
          # Verify we meet minimum requirements
          if [ "$final_size" -lt "$MIN_FILE_CHARS" ]; then
            echo "Warning: Final size ($final_size) is below minimum requirement ($MIN_FILE_CHARS chars)"
            echo "Adding padding to meet minimum..."
            {
              echo "Note: This PR contains very small files or no significant content changes."
              printf "%*s" "$(($MIN_FILE_CHARS - $(wc -c < file_snippets.txt)))" "" | tr ' ' '.'
            } >> file_snippets.txt
          fi
          
          ls -l file_snippets.txt || true
          echo "Preview (first 300 chars):"
          head -c 300 file_snippets.txt || true

      - name: Get AI License Compliance API auth token
        env:
          BLACKDUCKSCA_URL: ${{ vars.BLACKDUCKSCA_URL }}
          BLACKDUCKSCA_TOKEN: ${{ secrets.BLACKDUCKSCA_TOKEN }}
        run: |
          python3 << 'EOF'
          import os
          import sys
          import json
          import requests
          from urllib.parse import urljoin

          def main():
              # Check required environment variables
              blackduck_url = os.getenv('BLACKDUCKSCA_URL')
              blackduck_token = os.getenv('BLACKDUCKSCA_TOKEN')
              
              if not blackduck_url or not blackduck_token:
                  print("Missing BLACKDUCKSCA_URL (repository variable) or BLACKDUCKSCA_TOKEN (secret)")
                  print("Add `BLACKDUCKSCA_URL` under Settings → Variables and `BLACKDUCKSCA_TOKEN` under Settings → Secrets.")
                  sys.exit(1)
              
              # Prepare authentication endpoint
              auth_endpoint = urljoin(blackduck_url.rstrip('/') + '/', 'api/tokens/authenticate')
              print(f"Requesting auth token from {auth_endpoint}")
              
              # Prepare headers and payload
              headers = {
                  'Content-Type': 'application/json',
                  'Authorization': f'token {blackduck_token}'
              }
              
              try:
                  # Make authentication request
                  response = requests.post(auth_endpoint, headers=headers, json={}, timeout=30)
                  
                  # Save raw response for debugging
                  with open('token.json', 'w') as f:
                      f.write(response.text)
                  
                  print("--- raw token response ---")
                  print(response.text)
                  
                  # Check if request was successful
                  if response.status_code >= 400:
                      print(f"Authentication failed with status {response.status_code}")
                      print(f"Response: {response.text}")
                      sys.exit(1)
                  
                  # Try to parse JSON response
                  try:
                      token_data = response.json()
                  except json.JSONDecodeError:
                      # Fallback to raw content if not JSON
                      auth_token = response.text.strip().strip('"')
                  else:
                      # Extract token from various possible fields
                      auth_token = (
                          token_data.get('bearerToken') or 
                          token_data.get('token') or 
                          token_data.get('auth_token') or 
                          token_data.get('access_token') or 
                          token_data.get('tokenValue') or 
                          token_data.get('value') or 
                          token_data.get('data')
                      )
                  
                  if not auth_token:
                      print("Failed to extract auth token from response")
                      sys.exit(1)
                  
                  print(f"Auth token extracted (truncated): {auth_token[:8]}...")
                  
                  # Save token to file
                  with open('auth_token.txt', 'w') as f:
                      f.write(auth_token)
                  
                  print("Authentication successful")
                  
              except requests.exceptions.RequestException as e:
                  print(f"Request failed: {e}")
                  sys.exit(1)
              except Exception as e:
                  print(f"Unexpected error: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

      - name: Send file snippets to Black Duck Snippet API
        env:
          BLACKDUCKSCA_URL: ${{ vars.BLACKDUCKSCA_URL }}
        run: |
          python3 << 'EOF'
          import os
          import sys
          import json
          import requests
          from urllib.parse import urljoin

          def main():
              # Check for auth token file
              if not os.path.exists('auth_token.txt'):
                  print("Missing auth token file (auth_token.txt)")
                  sys.exit(1)
              
              # Check for file snippets
              if not os.path.exists('file_snippets.txt'):
                  print("No file snippets to scan (file_snippets.txt not found)")
                  # Create empty response for downstream processing
                  with open('response.json', 'w') as f:
                      json.dump({"snippetMatches": {}}, f)
                  return
              
              # Read auth token
              with open('auth_token.txt', 'r') as f:
                  auth_token = f.read().strip()
              
              # Read file snippets
              with open('file_snippets.txt', 'r', encoding='utf-8', errors='ignore') as f:
                  snippet_content = f.read()
              
              blackduck_url = os.getenv('BLACKDUCKSCA_URL')
              if not blackduck_url:
                  print("Missing BLACKDUCKSCA_URL environment variable")
                  sys.exit(1)
              
              # Prepare API endpoint
              api_endpoint = urljoin(blackduck_url.rstrip('/') + '/', 'api/snippet-matching')
              print(f"Posting file snippets to {api_endpoint}")
              
              # Log snippet size
              snippet_size = len(snippet_content.encode('utf-8'))
              print(f"Sending {snippet_size} bytes of file snippets")
              
              # Prepare headers
              headers = {
                  'Authorization': f'Bearer {auth_token}',
                  'Content-Type': 'text/plain; charset=utf-8'
              }
              
              try:
                  # Make API request
                  response = requests.post(
                      api_endpoint, 
                      headers=headers, 
                      data=snippet_content.encode('utf-8'),
                      timeout=int(os.getenv('API_TIMEOUT', '120'))  # Configurable timeout
                  )
                  
                  print(f"HTTP status: {response.status_code}")
                  
                  # Save response
                  with open('response.json', 'w') as f:
                      f.write(response.text)
                  
                  # Show preview
                  preview = response.text[:500] + '...' if len(response.text) > 500 else response.text
                  print(f"Response preview: {preview}")
                  
                  # Check for errors
                  if response.status_code >= 400:
                      print(f"Black Duck Snippet API returned an error (status {response.status_code}).")
                      print(f"Full error response: {response.text}")
                      sys.exit(1)
                  
                  # Validate JSON response
                  try:
                      response.json()
                      print("Response is valid JSON")
                  except json.JSONDecodeError as e:
                      print(f"Warning: Response is not valid JSON: {e}")
                      print("Continuing with raw response...")
                  
                  print("Snippet scan completed successfully")
                  
              except requests.exceptions.RequestException as e:
                  print(f"Request failed: {e}")
                  sys.exit(1)
              except Exception as e:
                  print(f"Unexpected error: {e}")
                  sys.exit(1)

          if __name__ == "__main__":
              main()
          EOF

      - name: Comment PR with Black Duck results
        uses: actions/github-script@v7
        with:
          github-token: ${{ github.token }}
          script: |
            const fs = require('fs');
            const { owner, repo } = context.repo;
            const issue_number = context.issue.number;
            
            // Check for existing Black Duck comments to avoid duplicates
            const comments = await github.rest.issues.listComments({
              owner,
              repo,
              issue_number
            });
            
            const commentHeader = '${{ env.COMMENT_HEADER }}';
            const existingComment = comments.data.find(comment =>
              comment.body.includes(commentHeader) &&
              comment.user.login === 'github-actions[bot]'
            );
            
            let body = `### ${commentHeader}\n`;
            body += `*Scanned first ${{ env.MIN_FILE_CHARS }}-${{ env.MAX_TOTAL_CHARS }} characters of each changed source code file in this PR*\n\n`;
            
            if (fs.existsSync('response.json')) {
              try {
                const respText = fs.readFileSync('response.json', 'utf8');
                
                // Validate JSON before parsing
                if (!respText.trim()) {
                  throw new Error('Empty response file');
                }
                
                const response = JSON.parse(respText);
                
                // Enhanced response validation
                if (!response || typeof response !== 'object') {
                  throw new Error('Invalid response structure');
                }
                
                // Check if snippetMatches exists and process the nested structure
                if (response.snippetMatches && typeof response.snippetMatches === 'object') {
                  const matchCategories = Object.keys(response.snippetMatches);
                  let totalMatches = 0;
                  
                  // Count total matches across all categories
                  matchCategories.forEach(category => {
                    if (Array.isArray(response.snippetMatches[category])) {
                      totalMatches += response.snippetMatches[category].length;
                    }
                  });
                  
                  if (totalMatches > 0) {
                    body += `🔍 **Found ${totalMatches} snippet match(es) across ${matchCategories.length} license categor${matchCategories.length === 1 ? 'y' : 'ies'}:**\n\n`;
                    
                    let matchIndex = 1;
                    
                    // Process each license category
                    matchCategories.forEach(category => {
                      if (response.snippetMatches[category] && response.snippetMatches[category].length > 0) {
                        body += `### ${category.replace(/_/g, ' ').toLowerCase().replace(/\b\w/g, l => l.toUpperCase())} (${response.snippetMatches[category].length} match${response.snippetMatches[category].length === 1 ? '' : 'es'})\n\n`;
                        
                        response.snippetMatches[category].forEach((match) => {
                          body += `#### Match ${matchIndex++}\n`;
                          
                          if (match.projectName) {
                            body += `- **Project**: ${match.projectName}\n`;
                          }
                          if (match.releaseVersion) {
                            body += `- **Version**: ${match.releaseVersion}\n`;
                          }
                          if (match.matchedFilePath) {
                            body += `- **Matched File Path**: \`${match.matchedFilePath}\`\n`;
                          }
                          if (match.licenseDefinition && match.licenseDefinition.licenseDisplayName) {
                            body += `- **License**: ${match.licenseDefinition.licenseDisplayName}\n`;
                          }
                          if (match.regions) {
                            const regions = match.regions;
                            if (regions.sourceStartLines && regions.sourceEndLines) {
                              body += `- **Source Lines**: ${regions.sourceStartLines.join(', ')}-${regions.sourceEndLines.join(', ')}\n`;
                            }
                            if (regions.matchedStartLines && regions.matchedEndLines) {
                              body += `- **Matched Lines**: ${regions.matchedStartLines.join(', ')}-${regions.matchedEndLines.join(', ')}\n`;
                            }
                          }
                          
                          body += '\n';
                        });
                        
                        body += '\n';
                      }
                    });
                  } else {
                    body += '✅ **No snippet matches found** - No known open source code detected in the pull request changes.\n\n';
                  }
                } else {
                  body += '✅ **No snippet matches found** - No known open source code detected in the pull request changes.\n\n';
                }
                
                // Add raw response as collapsible section for debugging (with smart truncation)
                const maxLen = 30000;  // Leave room for formatted content
                let rawDisplay = respText;
                if (rawDisplay.length > maxLen) {
                  // Try to truncate at a logical JSON boundary
                  const truncateAt = rawDisplay.lastIndexOf('},', maxLen - 100);
                  if (truncateAt > maxLen / 2) {
                    rawDisplay = rawDisplay.slice(0, truncateAt + 1) + '\n... (truncated)';
                  } else {
                    rawDisplay = rawDisplay.slice(0, maxLen) + '\n... (truncated)';
                  }
                }
                body += '<details><summary>🔧 Raw API Response (for debugging)</summary>\n\n```json\n' + rawDisplay + '\n```\n</details>';
                
              } catch (parseError) {
                body += '⚠️ **Error parsing Black Duck response**: Could not parse JSON response.\n\n';
                console.error('JSON parse error:', parseError);
                
                // Fall back to raw content display
                const respText = fs.readFileSync('response.json', 'utf8');
                const maxLen = 30000;
                let display = respText;
                if (display.length > maxLen) {
                  display = display.slice(0, maxLen) + '\n... (truncated)';
                }
                body += '<details><summary>Raw response content</summary>\n\n```\n' + display + '\n```\n</details>';
              }
            } else {
              body += '❌ **No response captured from Black Duck** - The API request may have failed.\n\n';
            }
            
            // Update existing comment or create new one
            if (existingComment) {
              console.log('Updating existing Black Duck comment...');
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existingComment.id,
                body
              });
            } else {
              console.log('Creating new Black Duck comment...');
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number,
                body
              });
            }
